<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Public/CSS/RA_Seat.css">
    <title>Soccer Scan</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>



<div class="close-btn"> <a class="inline-block transition duration-300 ease-in-out hover:scale-120 hover: "
        href="/index.html">
        <img src="/Public/image/icon-salir.png" alt="Regresar" class="icon normal">
        <img src="/Public/image/icon-hover.png" alt="Regresar" class="icon hover">

    </a>
</div>

<div class="screen-detail">

    <div class="fondo-conteiner">

        <div class="camera-conteiner">


            <div class="menu-camera">


                <ul class="ul-icons">
                    <li>
                        <button class="btn" id="anim1" style="display: none;">

                            <img id="imgAnim1" src="/Public/image/icon-dance1.png" alt="">
                        </button>
                    </li>


                    <li>
                        <button class="btnFolder" id="btnClose">
                            <img id="Folder" src="/Public/image/icon-folder.png" alt="">
                        </button>

                    </li>

                    <li>
                        <button class="btn" id="anim2" style="display: none;">
                            <img id="imgAnim2" src="/Public/image/icon.-dance2.png" alt="">
                        </button>

                    </li>


                </ul>
            </div>

        </div>

    </div>

</div>

<body>



    <a-scene embedde arjs>

        <!-- MEXICO -->
        <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-Mexico.patt">

            <a-entity position="0 0 0" scale="0.1 0.1 0.1">


                <a-entity id="normal" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/idle/mexicoIdle.glb" animation-mixer="clip: *; loop: repeat"
                    visible="true"></a-entity>


                <a-entity id="Baile1" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/MexicoDance.glb"
                    animation-mixer="clip: macarena; loop: repeat" visible="false"></a-entity>

                <a-entity id="Baile2" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/MexicoDance1.glb" animation-mixer="clip: soccer; loop: repeat"
                    visible="false"></a-entity>



            </a-entity>
        </a-marker>
        <a-entity camera position="0 0 0"></a-entity>


        <!-- PORTUGAL -->
        <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-portugal.patt">

            <a-entity position="0 0 0" scale="0.1 0.1 0.1">


                <a-entity id="portugalNormal" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/idle/portugalIdle.glb" visible="true"></a-entity>



                <a-entity id="Portugal1" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/PortugalDance1.glb"
                    animation-mixer="clip: macarena ; loop: repeat" visible="false"></a-entity>

                <a-entity id="Portugal2" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/PortugalDance.glb" animation-mixer="clip: * ; loop: repeat"
                    visible="false"></a-entity>

            </a-entity>

        </a-marker>
        <a-entity camera position="0 0 0"></a-entity>


        <!-- FRANCIA -->
        <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-francia.patt">


            <a-entity position="0 0 0" scale="0.1 0.1 0.1">


                <a-entity id="franciaIdle" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/idle/FranciaIdle.glb" visible="true"></a-entity>


                <a-entity id="Francia1" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/FranciaDance.glb"
                    animation-mixer="clip: macarena; loop: repeat" visible="false"></a-entity>

                <a-entity id="Francia2" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/FranciaDance1.glb"
                    animation-mixer="clip: soccer; loop: repeat" visible="false"></a-entity>



            </a-entity>
        </a-marker>

        <a-entity camera position="0 0 0"></a-entity>


        <!-- EUA -->
        <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-eua.patt">

            <a-entity position="0 0 0" scale="0.1 0.1 0.1">


                <a-entity id="EuaNormal" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/idle/EuaIdle.glb" visible="true"></a-entity>


                <a-entity id="Eua1" position="0 0 0" scale="0.5" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/EuaDance.glb" animation-mixer="clip: macarena; loop: repeat"
                    visible="false"></a-entity>

                <a-entity id="Eua2" position="0 0 0" scale="0.5" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/EuaDance1.glb" animation-mixer="clip: soccer; loop: repeat"
                    visible="false"></a-entity>



            </a-entity>
        </a-marker>

        <a-entity camera position="0 0 0"></a-entity>



        <!-- ESPAÑA -->
        <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-españa.patt">
           
            <a-entity position="0 0 0" scale="0.1 0.1 0.1">


                <a-entity id="españaNormal" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/idle/espIdle.glb" visible="true"></a-entity>


                <a-entity id="españa1" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/EspDance.glb" animation-mixer="clip: macarena; loop: repeat"
                    visible="false"></a-entity>

                <a-entity id="españa2" position="0 0 0" scale="1" rotation="-90 0 0"
                    gltf-model="/Public/models/animations/EspDance1.glb" animation-mixer="clip: soccer; loop: repeat"
                    visible="false"></a-entity>



            </a-entity>
        </a-marker>

        <a-entity camera position="0 0 0"></a-entity>



    </a-scene>



</body>

<script src="/Public/scripts/RA/RA.js"></script>

</html>
