<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Soccer Scan - AR Países</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/Public/scripts/tailwind-config.js"></script>
    <link rel="stylesheet" href="/Public/CSS/RA_Seat.css">
    
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; padding:0; overflow:hidden; background:url('/Public/image/grayFound.png') center/cover; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;">

    <div style="position:fixed; top:15px; right:15px; z-index:999;">
        <a href="/index.html"><img src="/Public/image/icon-salir.png" alt="Salir" style="width:40px; height:40px;"></a>
    </div>

    <div style="position:relative; width:min(95vw, 1100px); height:min(60vw, 600px); max-height:90vh;
                background:url('/Public/image/div-camera.png') center/100% 100% no-repeat;
                display:flex; align-items:center; justify-content:center;">
        
        <div id="camera-wrapper" style="position:relative; width:clamp(200px, 30%, 320px); aspect-ratio:9/16; 
                    overflow:hidden; border-radius:20px; background:#000;
                    border:3px solid rgba(53,70,248,0.4); box-shadow:0 0 30px rgba(53,70,248,0.3);">
            
            <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" 
                     style="position:absolute; top:0; left:0; width:100%; height:100%;">
                
                <!-- MÉXICO - TUS POSICIONES ORIGINALES -->
                <a-marker preset="pattern" type="pattern" url="/Public/makers/pattern-Mexico.patt">
                    <a-entity position="0 0 0" scale="0.12 0.12 0.12">
                        <a-entity id="mex-normal" position="0 0.5 6" scale="1 1 1" rotation="-30 -90 90" 
                                  gltf-model="/Public/models/idle/mexicoIdle.glb"></a-entity>
                    </a-entity>
                </a-marker>

                <a-entity camera position="0 0 0"></a-entity>
            </a-scene>

            <!-- TEXTO -->
            <div id="guide-text" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; pointer-events:none; transition:opacity 0.4s;">
                <div style="background:rgba(0,0,0,0.7); padding:10px 18px; border-radius:20px; border:1px solid rgba(255,255,255,0.2);">
                    <p style="color:white; font-size:14px; margin:0; font-family:sans-serif;">📷 Apunta a un marcador</p>
                </div>
            </div>

            <!-- BOTONES -->
            <div style="position:absolute; bottom:10px; left:0; right:0; z-index:20; display:flex; justify-content:center; gap:10px;">
                <button id="anim1" style="display:none; width:36px; height:36px; border-radius:50%; background:white; border:2px solid #3546F8; cursor:pointer;">
                    <img src="/Public/image/icon-dance1.png" style="width:17px; height:17px;">
                </button>
                <button id="btnClose" style="width:44px; height:44px; border-radius:50%; background:#3546F8; border:2px solid rgba(255,255,255,0.5); cursor:pointer;">
                    <img id="Folder" src="/Public/image/icon-folder.png" style="width:22px; height:22px; filter:invert(1);">
                </button>
                <button id="anim2" style="display:none; width:36px; height:36px; border-radius:50%; background:white; border:2px solid #3546F8; cursor:pointer;">
                    <img src="/Public/image/icon.-dance2.png" style="width:17px; height:17px;">
                </button>
            </div>
        </div>
    </div>

    <script>
        const btnClose = document.getElementById("btnClose");
        const folderIcon = document.getElementById("Folder");
        const btnAnim1 = document.getElementById("anim1");
        const btnAnim2 = document.getElementById("anim2");
        const guideText = document.getElementById('guide-text');
        const modelo = document.getElementById('mex-normal');
        
        let abierto = false;
        let animacionActiva = null;
        let tiempoAnimacion = 0;

        // Tus valores originales
        const ROT_X = -30 * (Math.PI / 180);
        const ROT_Y = -90 * (Math.PI / 180);
        const ROT_Z = 90 * (Math.PI / 180);

        btnClose.addEventListener("click", () => {
            abierto = !abierto;
            if (abierto) {
                folderIcon.src = "/Public/image/folder-symlink-fill.png";
                btnAnim1.style.display = "flex";
                btnAnim2.style.display = "flex";
            } else {
                folderIcon.src = "/Public/image/icon-folder.png";
                btnAnim1.style.display = "none";
                btnAnim2.style.display = "none";
                animacionActiva = null;
            }
        });

        function animarBaile1() {
            if (!modelo || !modelo.object3D) return;
            tiempoAnimacion += 0.05;
            modelo.object3D.rotation.set(
                ROT_X + Math.sin(tiempoAnimacion) * 0.2,
                ROT_Y + Math.sin(tiempoAnimacion * 1.5) * 0.3,
                ROT_Z + Math.sin(tiempoAnimacion * 2) * 0.3
            );
            modelo.object3D.position.set(0, 0.5 + Math.sin(tiempoAnimacion * 3) * 0.15, -4);
        }

        function animarBaile2() {
            if (!modelo || !modelo.object3D) return;
            tiempoAnimacion += 0.05;
            modelo.object3D.rotation.set(
                ROT_X + Math.sin(tiempoAnimacion) * 0.15,
                ROT_Y + Math.sin(tiempoAnimacion * 2) * 0.4,
                ROT_Z + Math.sin(tiempoAnimacion * 3) * 0.25
            );
            modelo.object3D.position.set(0, 0.5 + Math.abs(Math.sin(tiempoAnimacion * 4)) * 0.5, 6);
        }

        btnAnim1.addEventListener("click", () => { animacionActiva = 'baile1'; tiempoAnimacion = 0; });
        btnAnim2.addEventListener("click", () => { animacionActiva = 'baile2'; tiempoAnimacion = 0; });

        function loop() {
            if (modelo && modelo.object3D) {
                if (animacionActiva === 'baile1') animarBaile1();
                else if (animacionActiva === 'baile2') animarBaile2();
                else if (animacionActiva === null) {
                    modelo.object3D.rotation.set(ROT_X, ROT_Y, ROT_Z);
                    modelo.object3D.position.set(0, 0.5, 6);
                }
            }
            requestAnimationFrame(loop);
        }
        loop();

        document.querySelectorAll('a-marker').forEach(marker => {
            marker.addEventListener('markerFound', () => { if (guideText) guideText.style.opacity = '0'; });
            marker.addEventListener('markerLost', () => { if (guideText) guideText.style.opacity = '1'; });
        });

        setTimeout(() => {
            document.querySelectorAll('canvas').forEach(c => {
                if (!c.closest('#camera-wrapper')) c.remove();
            });
        }, 2000);
    </script>
</body>
</html>
