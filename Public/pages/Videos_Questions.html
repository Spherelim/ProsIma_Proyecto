    <!-- Script para manejo del menú responsive -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.querySelector(".menu-toggle");
            const submenu = document.querySelector("#submenu-preguntas");
            const overlay = document.querySelector(".menu-overlay");

            // Función para abrir menú
            function openMenu() {
                submenu.classList.add("active");
                submenu.classList.remove("hidden");
                submenu.style.transform = "translateX(0)";
                overlay.classList.remove("hidden");
                document.body.style.overflow = "hidden";
            }

            // Función para cerrar menú
            function closeMenu() {
                submenu.classList.remove("active");
                submenu.style.transform = "translateX(-100%)";
                overlay.classList.add("hidden");
                document.body.style.overflow = "";
                
                // Ocultar después de la animación
                setTimeout(() => {
                    if (!submenu.classList.contains("active")) {
                        submenu.classList.add("hidden");
                    }
                }, 300);
            }

            // Toggle menú
            toggle.addEventListener("click", function (e) {
                e.stopPropagation();
                if (submenu.classList.contains("active")) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            // Cerrar al hacer clic en overlay
            overlay.addEventListener("click", closeMenu);

            // Cerrar al hacer clic en un enlace del menú (en móvil)
            submenu.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", () => {
                    if (window.innerWidth < 1024) { // Cerrar en tablets y móviles
                        closeMenu();
                    }
                });
            });

            // Cerrar con tecla Escape
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && submenu.classList.contains("active")) {
                    closeMenu();
                }
            });

            // Ajustar al redimensionar ventana
            window.addEventListener("resize", () => {
                if (window.innerWidth >= 1024 && submenu.classList.contains("active")) {
                    // En desktop el menú puede quedarse abierto
                }
            });
        });
    </script>
