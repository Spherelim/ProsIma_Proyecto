<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/Fotos.css">
    <title>Soccer Scan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="close-btn"> 
        <a class="inline-block transition duration-300 ease-in-out hover:scale-120 hover: "
            href="/index.html">
            <img src="/Public/image/icon-salir.png" alt="Regresar" class="icon normal">
            <img src="/Public/image/icon-hover.png" alt="Regresar" class="icon hover">
        </a>
    </div>

    <!-- contenedor de la camara -->
    <div class="wrapper-Foto">
        
        <div class="camera-layout">
            <!-- Esta es la camara -->
            <div class="phone-camera">
                
                <!-- prende la camara automaticamente -->
                <video id="camara" autoplay playsinline></video>
                
                <!-- Pone el filtro encima de la camara -->
                <img id="overlay" class="overlay" src="" alt="">
                
                <button id="btnFoto"></button>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>

            <!-- preview -->
            <div class="preview-box">
                <img id="preview" src="/Public/image/placeholder.png" alt="Preview">
            </div>

        </div>

                
        <!-- Menú de filtros -->
        <div class="subFiltro">
            <ul>
                <li><img class="opcFiltro" src="/Public/image/btnFoto.png" alt=""></li>
                <li><img class="opcFiltro" src="/Public/image/filtro1.png" alt=""></li>
                <li><img class="opcFiltro" src="/Public/image/filtro2.png" alt=""></li>
                <li><img class="opcFiltro" src="/Public/image/filtro3.png" alt=""></li>
            </ul>
        </div>
        
    </div>            
    
    <!-- script de la camara -->
    <script src="/Public/scripts/camara.js"></script>

</body>


</html>
