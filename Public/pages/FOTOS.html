<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soccer Scan</title>
    <link rel="stylesheet" href="../src/output.css">

</head>

<body
    class="bg-[url('/Public/image/texture-pc.png')] bg bg-center bg-repeat  overflow-hidden grid place-items-center h-screen">
<br>
    
    <!-- contenedor de la camara -->
    <div class="wrapper-Foto">


        <div class="camera-layout relative flex justify-center items-center"><br>
        
            <div class="close-btn absolute z-2  top-6 left-[15px] md:top-22
            md:left-[80px] lg:top-28 lg:left-[100px] group">
                <a class="inline-block transition duration-300 ease-in-out hover:scale-120" href="/index.html">
                    <img src="/Public/image/icon-hover.png" alt="Regresar" class="icon normal w-20 md:w-24 block group-hover:hidden">
                    <img src="/Public/image/icon-salir.png" alt="Regresar" class="icon hover w-20  md:w-24 hidden group-hover:block">
        
                </a>
            </div>


            <!-- Esta es la camara -->
            <div class="phone-camera rounded-[25px]    sm:w-[360px] sm:h-[500px]  md:w-180 md:h-140 lg:w-275 lg:h-165">

                <!-- prende la camara automaticamente -->
                <video id="camara" class="border-4  md:border-[50px]  lg:border-[80px] border-[#3546F8] rounded-4xl " autoplay playsinline></video>


            </div>


            <!-- Pone el filtro encima de la camara -->
            <img id="overlay" class="absolute  pointer-events-none " src="" alt="">

            <div class="preview-box absolute bottom-[608px] left-9/12  md:bottom-8/12  md:left-9/12 lg:bottom-8/12 lg:left-220 z-2">
                <img id="preview" src="/Public/image/previewPhoto.jfif" alt="Preview"
                    class="w-18 h-18 md:w-24 md:h-24 rounded-full border-2 border-[#3546F8]">
            </div>

            <canvas id="canvas" style="display:none;"></canvas>
        </div>



    </div>

    <!-- Menú de filtros -->
    <div class="subFiltro relative flex justify-center items-center gap-4 bottom-33 z-2">

        <ul class="flex gap-4">
            <li><button id="btnFoto" class=""> <img src="/Public/image/btnFoto.png" alt=""></button></li>
            <li><img class="opcFiltro" src="/Public/image/filtro1.png" alt=""></li>
            <li><img class="opcFiltro" src="/Public/image/filtro2.png" alt=""></li>
            <li><img class="opcFiltro" src="/Public/image/filtro3.png" alt=""></li>

        </ul>
    </div>
    <!-- script de la camara -->
    <script src="/Public/scripts/camara.js"></script>

</body>


</html>
