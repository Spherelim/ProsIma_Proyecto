<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soccer Scan</title>
    <link rel="stylesheet" href="../src/output.css">

</head>

<body
    class="bg-[url('/Public/image/texture-pc.png')] bg bg-center bg-repeat  overflow-hidden grid place-items-center h-screen">
<br>
    
    <!-- contenedor de la camara -->
    <div class="wrapper-Foto">


        <div class="camera-layout relative flex justify-center items-center"><br>
        
            <div class="close-btn absolute z-2  top-8 lg:top-12 left-[40px] group">
                <a class="inline-block transition duration-300 ease-in-out hover:scale-120" href="/index.html">
                    <img src="/Public/image/icon-salirV2.png" alt="Regresar" class="icon normal w-14 block group-hover:hidden">
                    <img src="/Public/image/icon-hover.png" alt="Regresar" class="icon hover w-14 hidden group-hover:block">
        
                </a>
            </div>


            <!-- Esta es la camara -->
            <div class="phone-camera rounded-[25px]    sm:w-max-[400px] sm:h-4/5  md:w-180 md:h-140 lg:w-275 lg:h-165">

                <!-- prende la camara automaticamente -->
                <video id="camara" class="border-8 border-[#3546F8] rounded-2xl" autoplay playsinline></video>


            </div>


            <!-- Pone el filtro encima de la camara -->
            <img id="overlay" class="absolute  pointer-events-none " src="" alt="">

            <div class="preview-box absolute bottom-7/8 left-9/12  md:bottom-5/6  md:left-10/12 lg:bottom-5/6 lg:left-250 z-2">
                <img id="preview" src="/Public/image/previewPhoto.jfif" alt="Preview"
                    class="w-14 h-14 rounded-full border-2 border-[#3546F8]">
            </div>

            <canvas id="canvas" style="display:none;"></canvas>
        </div>



    </div>

    <!-- Menú de filtros -->
    <div class="subFiltro relative flex justify-center items-center gap-4 bottom-36 z-2">

        <ul class="flex gap-4">
            <li><button id="btnFoto" class=""> <img src="/Public/image/btnFoto.png" alt=""></button></li>
            <li><img class="opcFiltro" src="/Public/image/filtro1.png" alt=""></li>
            <li><img class="opcFiltro" src="/Public/image/filtro2.png" alt=""></li>
            <li><img class="opcFiltro" src="/Public/image/filtro3.png" alt=""></li>

        </ul>
    </div>
    <!-- script de la camara -->
    <script src="/Public/scripts/camara.js"></script>

</body>


</html>
